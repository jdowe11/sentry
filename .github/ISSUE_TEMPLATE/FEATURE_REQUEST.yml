name: "Feature Request"
description: Create a new ticket for a new feature request
title: "[FEATURE] - "
labels: [
  "enhancement"
]
body:
  - type: textarea
    id: summary
    attributes:
      label: "Summary"
      description: Provide a brief explanation of the feature
      placeholder: Describe in a few lines your feature request
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: "Checklist"
      description: List the checklist items the are required for this feature
      value: |
        - [ ] Example List Item...
        - [ ] Example List Item...
    validations:
      required: true
  - type: textarea
    id: unresolved_question
    attributes:
      label: "Unresolved questions"
      description: What questions still remain unresolved ?
      placeholder: Identify any unresolved issues.
    validations:
      required: false
